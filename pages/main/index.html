<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="header__title-wrapper">
      <h1 class="header__title">Cozy House</h1>
      <p class="header__title-description">Shelter for pets in Boston</p>
    </div>
    <button class="header__btn-menu">
    </button>
  </header>
  <main class="main">
    <section class="main__content">
      <div class="main__content-block">
        <h2 class="main__content-title">Not only people need a house</h2>
        <p class="main__content-text">We offer to give a chance to a little and nice puppy with an extremely wide and open heart. He or she will love you more than anybody else in the world, you will see!</p>
        <button class="main__content-button">Make a friend</button>
      </div>
      <img class="main__content-image" src="../../assets/images/content-image.png" alt=""/>
    </section>
  </main>
  <footer class="footer"></footer>
</body>

</html>
